databases:
  - name: documesh-db
    databaseName: documesh
    user: documesh_user
    plan: free

services:
  - type: web
    name: pdf-annotator-graph
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: documesh-db
          property: connectionString
      - key: LLM_PROVIDER
        value: fake
      - key: EMBEDDING_MODEL_NAME
        value: fake
