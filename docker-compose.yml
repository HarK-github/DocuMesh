# Docker Compose for local PostgreSQL development
# Usage:
#   1. docker compose up -d db        # Start only the database
#   2. docker compose up -d           # Start everything (db + app)
#   3. docker compose down -v         # Tear down and delete volumes

version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: documesh
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d documesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/documesh
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:7860"
      - "7860:7860"
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

volumes:
  postgres_data:
  uploads_data:
